<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Debug Viewer</title>
    <style>
      :root {
        --bg: #101218;
        --panel: #181c24;
        --panel-2: #202633;
        --border: rgba(255, 255, 255, 0.1);
        --text: #edf2f7;
        --muted: #a8b3c7;
        --accent: #ffd166;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Avenir Next", sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 209, 102, 0.14),
            transparent 28%
          ),
          radial-gradient(
            circle at top right,
            rgba(17, 138, 178, 0.18),
            transparent 24%
          ),
          linear-gradient(180deg, #151922 0%, #0d1016 100%);
      }

      .shell {
        width: min(1800px, calc(100vw - 32px));
        margin: 24px auto;
        display: grid;
        gap: 20px;
      }

      .hero,
      .panel {
        border: 1px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.02)
        );
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        border-radius: 20px;
      }

      .hero {
        padding: 24px 28px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 10px 0 0;
        max-width: 64ch;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        min-width: 250px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.22);
        color: var(--muted);
        font-size: 0.95rem;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        padding: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .field select,
      .field input,
      .field button {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
      }

      .field button {
        cursor: pointer;
        background: linear-gradient(180deg, #ffd166, #f7b538);
        color: #241600;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns:
          minmax(280px, 420px) minmax(0, 1fr)
          minmax(280px, 420px);
        gap: 20px;
      }

      .panel {
        padding: 18px;
        overflow: hidden;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .image-wrap,
      .svg-wrap {
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          #121722;
        background-size: 16px 16px;
        min-height: 320px;
        display: grid;
        place-items: center;
      }

      #source-image {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        image-rendering: pixelated;
      }

      #debug-svg {
        width: 100%;
        height: min(78vh, 920px);
        display: block;
      }

      .summary {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .tooltip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        background: rgba(8, 12, 20, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 0.82rem;
        line-height: 1.35;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        max-width: 280px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 100ms ease,
          transform 100ms ease;
      }

      .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tooltip-title {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .tooltip-line {
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .toolbar,
        .grid {
          grid-template-columns: 1fr;
        }

        .hero {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="hover-tooltip" class="tooltip" aria-hidden="true"></div>
    <main class="shell">
      <section class="hero">
        <div>
          <h1>Split Debug Viewer</h1>
          <p>
            Inspect contour nodes and segments by contour and stage. Segment
            labels are anchored to each segment's first point.
          </p>
        </div>
        <div class="status" id="status">
          Loading split_debug.json and shape.png…
        </div>
      </section>

      <section class="panel toolbar">
        <div class="field">
          <label for="contour-select">Contour</label>
          <select id="contour-select"></select>
        </div>
        <div class="field">
          <label for="stage-select">Stage</label>
          <select id="stage-select"></select>
        </div>
        <div class="field">
          <label for="json-input">Split Debug JSON</label>
          <input id="json-input" type="file" accept="application/json,.json" />
        </div>
        <div class="field">
          <label for="image-input">Source Image</label>
          <input id="image-input" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="reload-defaults" type="button">Reload Defaults</button>
        </div>
      </section>

      <section class="grid">
        <section class="panel">
          <h2>Source Image</h2>
          <div class="image-wrap">
            <img id="source-image" alt="Source raster" />
          </div>
        </section>

        <section class="panel">
          <h2>Fragment Points</h2>
          <div class="svg-wrap">
            <svg
              id="debug-svg"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Fragment debug view"
            ></svg>
          </div>
          <div class="summary" id="summary"></div>
        </section>

        <section class="panel">
          <h2>Final Path</h2>
          <div class="image-wrap">
            <svg
              id="final-svg"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Final path overlay"
            ></svg>
          </div>
        </section>
      </section>
    </main>

    <script>
      const state = {
        debugData: null,
        imageUrl: null,
        contourIndex: null,
        stage: null,
      };

      const contourSelect = document.getElementById("contour-select");
      const stageSelect = document.getElementById("stage-select");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const debugSvg = document.getElementById("debug-svg");
      const finalSvg = document.getElementById("final-svg");
      const sourceImage = document.getElementById("source-image");
      const jsonInput = document.getElementById("json-input");
      const imageInput = document.getElementById("image-input");
      const reloadButton = document.getElementById("reload-defaults");
      const hoverTooltip = document.getElementById("hover-tooltip");

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function fragmentColor(fragmentId, fragmentCount) {
        const hue = ((fragmentId / fragmentCount) * 720) % 360;
        return `hsl(${hue} 78% 62%)`;
      }

      function getContourId(contour, fallbackIndex) {
        if (typeof contour?.contour_id === "number") {
          return contour.contour_id;
        }
        return fallbackIndex;
      }

      function getEntryId(entry, fallbackIndex) {
        return (
          entry.fragment_id ??
          entry.segment_id ??
          entry.node_id ??
          fallbackIndex + 1
        );
      }

      function getEntryContourId(entry) {
        return entry.contour_id ?? entry.root_contour_index;
      }

      function getRenderableEntries() {
        return state.debugData.segments;
      }

      function rcToXy(point) {
        return { x: Number(point[1]), y: Number(point[0]) };
      }

      function getContourBounds(points) {
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;

        for (const point of points) {
          const { x, y } = rcToXy(point);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }

        return { minX, minY, maxX, maxY };
      }

      function populateContourOptions() {
        const contours = state.debugData?.contours ?? [];
        contourSelect.innerHTML = "";

        contours.forEach((contour, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `Contour ${index} (${contour.points.length} points)`;
          contourSelect.appendChild(option);
        });

        if (!contours.length) {
          state.contourIndex = null;
          return;
        }

        if (
          state.contourIndex == null ||
          state.contourIndex >= contours.length
        ) {
          state.contourIndex = 0;
        }

        contourSelect.value = String(state.contourIndex);
      }

      function populateStageOptions() {
        const entries = getRenderableEntries();
        const contour = state.debugData?.contours?.[state.contourIndex];
        const selectedContourId = getContourId(contour, state.contourIndex);

        const stages = [
          ...new Set(
            entries
              .filter((entry) => getEntryContourId(entry) === selectedContourId)
              .map((entry) => entry.stage)
              .filter(Boolean),
          ),
        ].sort();

        if (Array.isArray(state.debugData?.nodes)) {
          const hasNodesForContour = state.debugData.nodes.some(
            (node) => node.contour_id === selectedContourId,
          );
          if (hasNodesForContour) {
            stages.push("nodes");
          }
        }

        if (Array.isArray(contour?.fitted) && contour.fitted.length) {
          stages.push("vectorization");
        }

        stageSelect.innerHTML = "";
        stages.forEach((stage) => {
          const option = document.createElement("option");
          option.value = stage;
          option.textContent = stage;
          stageSelect.appendChild(option);
        });

        if (!stages.length) {
          state.stage = null;
          return;
        }

        if (!stages.includes(state.stage)) {
          state.stage = stages[0];
        }

        stageSelect.value = state.stage;
      }

      function renderSummary(entries, contourPoints) {
        const pointsShown = entries.reduce(
          (sum, entry) => sum + (entry.contour_indices?.length ?? 0),
          0,
        );
        summaryEl.innerHTML = "";

        const chips = [
          `Contour ${state.contourIndex}`,
          `Stage ${state.stage ?? "none"}`,
          `${entries.length} entries`,
          `${pointsShown} entry points`,
          `${contourPoints.length} contour points`,
        ];

        for (const text of chips) {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.textContent = text;
          summaryEl.appendChild(chip);
        }
      }

      function formatNodeTooltip(entry, entryId) {
        const entryLabel = entry.stage === "path_segment" ? "Segment" : "Node";
        const reasons = Array.isArray(entry.reasons)
          ? entry.reasons.join(", ")
          : Array.isArray(entry.reason_tags)
            ? entry.reason_tags.join(", ")
            : "n/a";

        const transition = entry.transition ?? entry.kind ?? "n/a";
        const continuity = entry.continuity ?? "n/a";
        const index =
          typeof entry.contour_index === "number"
            ? entry.contour_index
            : Array.isArray(entry.contour_indices)
              ? entry.contour_indices[0]
              : "n/a";

        return `
          <div class="tooltip-title">${entryLabel} #${entryId}</div>
          <div class="tooltip-line">Index: ${index}</div>
          <div class="tooltip-line">Reasons: ${reasons}</div>
          <div class="tooltip-line">Split type: ${transition}</div>
          <div class="tooltip-line">Continuity: ${continuity}</div>
        `;
      }

      function withNodeMetadata(entry, nodesById) {
        if (entry.stage === "nodes") {
          return entry;
        }

        const startNode = nodesById.get(entry.start_node_id);
        const endNode = nodesById.get(entry.end_node_id);
        if (!startNode) {
          return entry;
        }

        return {
          ...entry,
          contour_index: startNode.contour_index,
          reasons: startNode.reasons,
          reason_tags: startNode.reason_tags,
          transition: startNode.transition,
          continuity: startNode.continuity,
          tooltip_suffix: endNode
            ? `\n          <div class="tooltip-line">End node: #${endNode.node_id}</div>`
            : "",
        };
      }

      function showTooltip(event, html) {
        hoverTooltip.innerHTML = html;
        hoverTooltip.classList.add("visible");
        hoverTooltip.setAttribute("aria-hidden", "false");
        positionTooltip(event);
      }

      function positionTooltip(event) {
        const margin = 14;
        const x = event.clientX + margin;
        const y = event.clientY + margin;
        const rect = hoverTooltip.getBoundingClientRect();

        let left = x;
        let top = y;
        if (left + rect.width > window.innerWidth - 8) {
          left = event.clientX - rect.width - margin;
        }
        if (top + rect.height > window.innerHeight - 8) {
          top = event.clientY - rect.height - margin;
        }

        hoverTooltip.style.left = `${Math.max(8, left)}px`;
        hoverTooltip.style.top = `${Math.max(8, top)}px`;
      }

      function hideTooltip() {
        hoverTooltip.classList.remove("visible");
        hoverTooltip.setAttribute("aria-hidden", "true");
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs))
          el.setAttribute(k, String(v));
        return el;
      }

      function renderVectorizationStage(svg, fittedSegments, bounds, padding) {
        // Build the SVG path d-string from the fitted segments and collect
        // anchor / control-point coordinates for overlay rendering.
        const anchors = []; // {x, y, label, segIndex}
        const handles = []; // {ax, ay, cx, cy} — one per control point

        let d = "";
        let anchorIndex = 0;

        fittedSegments.forEach((seg, si) => {
          if (si === 0) {
            d += `M ${seg.start[0]},${seg.start[1]} `;
            anchors.push({
              x: seg.start[0],
              y: seg.start[1],
              label: String(anchorIndex++),
            });
          }

          if (seg.type === "line") {
            d += `L ${seg.end[0]},${seg.end[1]} `;
          } else if (seg.type === "cubic") {
            d += `C ${seg.control1[0]},${seg.control1[1]} ${seg.control2[0]},${seg.control2[1]} ${seg.end[0]},${seg.end[1]} `;
            handles.push({
              ax: seg.start[0],
              ay: seg.start[1],
              cx: seg.control1[0],
              cy: seg.control1[1],
            });
            handles.push({
              ax: seg.end[0],
              ay: seg.end[1],
              cx: seg.control2[0],
              cy: seg.control2[1],
            });
          }

          if (si < fittedSegments.length - 1) {
            anchors.push({
              x: seg.end[0],
              y: seg.end[1],
              label: String(anchorIndex++),
            });
          }
        });

        // Fitted bezier path
        svg.appendChild(
          svgEl("path", {
            d,
            fill: "none",
            stroke: "rgba(255,255,255,0.55)",
            "stroke-width": "1.5",
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
          }),
        );

        // Handle lines
        for (const h of handles) {
          svg.appendChild(
            svgEl("line", {
              x1: h.ax,
              y1: h.ay,
              x2: h.cx,
              y2: h.cy,
              stroke: "rgba(255,180,60,0.55)",
              "stroke-width": "0.8",
              "stroke-dasharray": "2 2",
            }),
          );
        }

        // Control points
        for (const h of handles) {
          svg.appendChild(
            svgEl("circle", {
              cx: h.cx,
              cy: h.cy,
              r: "1.8",
              fill: "rgba(255,180,60,0.85)",
              stroke: "rgba(0,0,0,0.4)",
              "stroke-width": "0.5",
            }),
          );
        }

        // Anchor nodes + labels
        const nAnchors = anchors.length;
        anchors.forEach(({ x, y, label }, i) => {
          const color = fragmentColor(i, Math.max(1, nAnchors));
          svg.appendChild(
            svgEl("circle", {
              cx: x,
              cy: y,
              r: "3",
              fill: color,
              stroke: "rgba(0,0,0,0.55)",
              "stroke-width": "0.7",
            }),
          );
          const txt = svgEl("text", {
            x: x + 4,
            y: y - 4,
            fill: color,
            "font-size": "8",
            "font-family": "IBM Plex Sans, Avenir Next, sans-serif",
            "font-weight": "700",
          });
          txt.textContent = `#${label}`;
          svg.appendChild(txt);
        });
      }

      function renderSvg() {
        hideTooltip();
        debugSvg.innerHTML = "";
        finalSvg.innerHTML = "";

        const contours = state.debugData?.contours ?? [];
        const entries = getRenderableEntries();
        const nodes = state.debugData?.nodes ?? [];
        const nodesById = new Map(nodes.map((node) => [node.node_id, node]));
        const final_path = state.debugData?.final_path ?? "";
        const contour = contours[state.contourIndex];

        if (!contour || !state.stage) {
          setStatus("No contour data available.");
          return;
        }

        const contourPoints = contour.points;
        const selectedContourId = getContourId(contour, state.contourIndex);

        const stageEntries =
          state.stage === "nodes"
            ? nodes
                .filter((node) => node.contour_id === selectedContourId)
                .map((node) => ({
                  ...node,
                  contour_indices: [node.contour_index],
                  stage: "nodes",
                }))
            : entries.filter(
                (entry) =>
                  getEntryContourId(entry) === selectedContourId &&
                  entry.stage === state.stage,
              );

        const bounds = getContourBounds(contourPoints);
        const padding = 24;
        const width = Math.max(1, bounds.maxX - bounds.minX) + padding * 2;
        const height = Math.max(1, bounds.maxY - bounds.minY) + padding * 2;
        debugSvg.setAttribute(
          "viewBox",
          `${bounds.minX - padding} ${bounds.minY - padding} ${width} ${height}`,
        );

        const background = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polyline",
        );
        background.setAttribute("fill", "none");
        background.setAttribute("stroke", "rgba(255,255,255,0.22)");
        background.setAttribute("stroke-width", "1.5");
        background.setAttribute(
          "points",
          contourPoints
            .map((point) => {
              const { x, y } = rcToXy(point);
              return `${x},${y}`;
            })
            .join(" "),
        );
        debugSvg.appendChild(background);

        if (state.stage === "vectorization") {
          renderVectorizationStage(
            debugSvg,
            contour.fitted ?? [],
            bounds,
            padding,
          );
          renderSummary([], contourPoints);
          setStatus(
            `Showing contour ${state.contourIndex}, vectorization stage, ${(contour.fitted ?? []).length} fitted segments.`,
          );

          const finalPath = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          finalPath.setAttribute("fill", "white");
          finalPath.setAttribute("stroke", "black");
          finalPath.setAttribute("stroke-width", "0.5");
          finalPath.setAttribute("d", final_path);
          finalSvg.setAttribute(
            "viewBox",
            `${bounds.minX - padding} ${bounds.minY - padding} ${width} ${height}`,
          );
          finalSvg.appendChild(finalPath);
          return;
        }

        stageEntries.forEach((entry, entryIndex) => {
          const entryId = getEntryId(entry, entryIndex);
          const color = fragmentColor(
            entryId,
            Math.max(1, stageEntries.length),
          );
          const points = (entry.contour_indices ?? [])
            .map((index) => contourPoints[index])
            .filter(Boolean)
            .map(rcToXy);

          if (!points.length) {
            return;
          }

          const tooltipEntry = withNodeMetadata(entry, nodesById);

          if (points.length > 1) {
            const path = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "polyline",
            );
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", color);
            path.setAttribute("stroke-width", "2.6");
            path.setAttribute("stroke-linecap", "round");
            path.setAttribute("stroke-linejoin", "round");
            path.setAttribute(
              "points",
              points.map((point) => `${point.x},${point.y}`).join(" "),
            );
            debugSvg.appendChild(path);
          }

          // const fpath = document.createElementNS(
          //   "http://www.w3.org/2000/svg",
          //   "path",
          // );
          // fpath.setAttribute("fill", "none");
          // fpath.setAttribute("stroke", color);
          // fpath.setAttribute("stroke-width", "1.2");
          // fpath.setAttribute("d", final_path);
          // debugSvg.appendChild(fpath);

          points.forEach((point, index) => {
            const circle = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            circle.setAttribute("cx", String(point.x));
            circle.setAttribute("cy", String(point.y));
            circle.setAttribute("r", index === 0 ? "3" : "0.8");
            circle.setAttribute("fill", index === 0 ? color : "none");
            circle.setAttribute("stroke", "rgba(0,0,0,0.55)");
            circle.setAttribute("stroke-width", index === 0 ? "0.7" : "0.2");

            if (index === 0) {
              let tooltipHtml = formatNodeTooltip(tooltipEntry, entryId);
              if (tooltipEntry.tooltip_suffix) {
                tooltipHtml = `${tooltipHtml}${tooltipEntry.tooltip_suffix}`;
              }
              circle.addEventListener("mouseenter", (event) => {
                showTooltip(event, tooltipHtml);
              });
              circle.addEventListener("mousemove", (event) => {
                positionTooltip(event);
              });
              circle.addEventListener("mouseleave", () => {
                hideTooltip();
              });
            }

            debugSvg.appendChild(circle);
          });

          if (points.length) {
            const firstPoint = points[0];
            const label = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text",
            );
            label.setAttribute("x", String(firstPoint.x + 4));
            label.setAttribute("y", String(firstPoint.y - 4));
            label.setAttribute("fill", color);
            label.setAttribute("font-size", "8");
            label.setAttribute(
              "font-family",
              "IBM Plex Sans, Avenir Next, sans-serif",
            );
            label.setAttribute("font-weight", "700");
            label.textContent = `#${entryId}`;
            debugSvg.appendChild(label);
          }
        });
        renderSummary(stageEntries, contourPoints);
        setStatus(
          `Showing contour ${state.contourIndex}, stage ${state.stage}, ${stageEntries.length} entries.`,
        );

        const finalPath = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        finalPath.setAttribute("fill", "white");
        finalPath.setAttribute("stroke", "black");
        finalPath.setAttribute("stroke-width", "0.5");
        finalPath.setAttribute("d", final_path);
        finalSvg.setAttribute(
          "viewBox",
          `${bounds.minX - padding} ${bounds.minY - padding} ${width} ${height}`,
        );
        finalSvg.appendChild(finalPath);
      }

      function refreshControlsAndRender() {
        populateContourOptions();
        populateStageOptions();
        renderSvg();
      }

      async function loadJsonFromUrl(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to load ${url}: ${response.status}`);
        }
        return response.json();
      }

      async function loadImageFromUrl(url) {
        sourceImage.src = url;
        await sourceImage.decode();
      }

      async function loadDefaults() {
        setStatus("Loading split_debug.json and shape.png…");
        try {
          const data = await loadJsonFromUrl("./split_debug.json");
          state.debugData = data;
          state.imageUrl = "./shape.png";
          await loadImageFromUrl(state.imageUrl);
          refreshControlsAndRender();
        } catch (error) {
          setStatus(
            `Automatic load failed. ${error.message} Use the file pickers above.`,
          );
        }
      }

      async function loadJsonFile(file) {
        const text = await file.text();
        state.debugData = JSON.parse(text);
        refreshControlsAndRender();
        setStatus(`Loaded ${file.name}.`);
      }

      async function loadImageFile(file) {
        if (state.imageUrl?.startsWith("blob:")) {
          URL.revokeObjectURL(state.imageUrl);
        }
        state.imageUrl = URL.createObjectURL(file);
        await loadImageFromUrl(state.imageUrl);
        renderSvg();
        setStatus(`Loaded ${file.name}.`);
      }

      contourSelect.addEventListener("change", () => {
        state.contourIndex = Number(contourSelect.value);
        populateStageOptions();
        renderSvg();
      });

      stageSelect.addEventListener("change", () => {
        state.stage = stageSelect.value;
        renderSvg();
      });

      jsonInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (file) {
          await loadJsonFile(file);
        }
      });

      imageInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (file) {
          await loadImageFile(file);
        }
      });

      reloadButton.addEventListener("click", () => {
        loadDefaults();
      });

      loadDefaults();
    </script>
  </body>
</html>
